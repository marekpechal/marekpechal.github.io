<!-- The Shared Modal Overlay Container (Only shows up when triggered) -->
<div id="map-modal" class="modal-overlay">
  <div class="modal-content">
    <button class="modal-close-btn" onclick="closeMapModal()">&times;</button>
    <div id="modal-map-window"></div>
  </div>
</div>


<!-- Unified Leaflet Engine Script -->
<script>

  // Centralized map registry tracking instances across the document
  let currentModalMap = null;

  function buildVectorMap(containerId, geojsonPath, lineColor = '#d9381e') {
      const mapStyleUrl = 'https://api.maptiler.com/maps/outdoor-v4/style.json?key=NPlRMxy1uYH9gIiVYt3P';

      return fetch(geojsonPath)
          .then(response => response.json())
          .then(geoJsonData => {
              const bbox = turf.bbox(geoJsonData);

              const mapInstance = new maplibregl.Map({
                  container: containerId,
                  style: mapStyleUrl,
                  bounds: bbox,
                  fitBoundsOptions: { padding: 80 } // Padded zoom level applied globally
              });

              mapInstance.addControl(new maplibregl.NavigationControl());

              mapInstance.on('load', () => {

                  // 1. Create a native browser canvas to paint a classic teardrop pin
                  const canvas = document.createElement('canvas');
                  canvas.width = 30;
                  canvas.height = 40;
                  const ctx = canvas.getContext('2d');
                  // Draw the teardrop path
                  ctx.beginPath();
                  ctx.moveTo(15, 40); // The sharp bottom tip
                  // Left side bezier curve
                  ctx.bezierCurveTo(3, 26, 0, 18, 0, 15);
                  // Top round head circle
                  ctx.arc(15, 15, 15, Math.PI, 0, false);
                  // Right side bezier curve
                  ctx.bezierCurveTo(30, 18, 27, 26, 15, 40);
                  ctx.closePath();
                  // Fill color: Classic Google Maps Red
                  ctx.fillStyle = '#EA4335';
                  ctx.fill();
                  // White border stroke outline
                  ctx.strokeStyle = '#FFFFFF';
                  ctx.lineWidth = 2;
                  ctx.stroke();
                  // Draw a inner center white dot
                  ctx.beginPath();
                  ctx.arc(15, 15, 5, 0, Math.PI * 2, true);
                  ctx.fillStyle = '#FFFFFF';
                  ctx.fill();

                  // 2. Safely capture the canvas data and name it 'teardrop-icon'
                  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                  mapInstance.addImage('teardrop-icon', imageData);

                  mapInstance.addSource(`src-${containerId}`, {
                      type: 'geojson',
                      data: geoJsonData
                  });

                  mapInstance.addLayer({
                      id: `lyr-${containerId}`,
                      type: 'line',
                      source: `src-${containerId}`,
                      paint: {
                          'line-color': ['coalesce', ['get', 'stroke'], lineColor],
                          'line-width': 4
                      }
                  });

                  mapInstance.addLayer({
                      id: `lyr-markers-${containerId}`,
                      type: 'symbol',
                      source: `src-${containerId}`,
                      filter: ['==', ['geometry-type'], 'Point'],
                      layout: {
                          'icon-image': 'teardrop-icon',
                          'icon-size': 1.0,           // Adjust size scale here if needed
                          'icon-anchor': 'bottom',    // Anchors the pointy tip precisely to the coordinate
                          'icon-allow-overlap': true  // Keeps markers visible when zooming out
                      }
                  });

                  mapInstance.addLayer({
                      id: `lyr-labels-${containerId}`,
                      type: 'symbol',
                      source: `src-${containerId}`,
                      filter: ['all', ['==', ['geometry-type'], 'Point'], false],
                      layout: {
                          'text-field': ['coalesce', ['get', 'name'], 'Location'],
                          'text-font': ['Open Sans Semibold', 'Arial Unicode MS Bold'],
                          'text-offset': [0, 1.2],
                          'text-anchor': 'top',
                          'text-allow-overlap': true
                      },
                      paint: {
                          'text-color': '#000000',
                          'text-halo-color': '#FFFFFF',
                          'text-halo-width': 2
                      }
                  });

                  const circleLayerId = `lyr-markers-${containerId}`;
                  const labelLayerId = `lyr-labels-${containerId}`;

                  mapInstance.on('mouseenter', circleLayerId, (e) => {
                      mapInstance.getCanvas().style.cursor = 'pointer';

                      if (e.features && e.features.length > 0) {
                          // Get the name property of the specific point under the cursor
                          const hoveredName = e.features[0].properties.name || 'Location';
                          // Update the filter to ONLY show the point with this exact name
                          mapInstance.setFilter(labelLayerId, [
                              'all',
                              ['==', ['geometry-type'], 'Point'],
                              ['==', ['get', 'name'], hoveredName]
                          ]);
                      }
                  });

                  mapInstance.on('mouseleave', circleLayerId, () => {
                      mapInstance.getCanvas().style.cursor = '';

                      // Reset the filter to hide all labels again when moving away
                      mapInstance.setFilter(labelLayerId, [
                          'all',
                          ['==', ['geometry-type'], 'Point'],
                          false
                      ]);
                  });


              });


              return mapInstance;
          })
          .catch(err => console.error(`Map instantiation error on [${containerId}]:`, err));
  }

  // 2. Streamlined Modal Core Handlers
  function openMapModal(trailPath) {
      const modal = document.getElementById('map-modal');
      const mapWindow = document.getElementById('modal-map-window');

      modal.classList.add('is-active');

      if (currentModalMap) {
          currentModalMap.remove();
          currentModalMap = null;
      }
      mapWindow.innerHTML = '';

      // Route directly through the centralized builder function
      buildVectorMap('modal-map-window', trailPath, '#0080ff').then(map => {
          currentModalMap = map;

          // Handle resizing once the modal's active CSS transition completes
          setTimeout(() => {
              if (currentModalMap) currentModalMap.resize();
          }, 250);
      });
  }

  function closeMapModal() {
      const modal = document.getElementById('map-modal');
      modal.classList.remove('is-active');

      if (currentModalMap) {
          currentModalMap.remove();
          currentModalMap = null;
      }
  }

  // Bind event listeners to emoji map triggers
  document.querySelectorAll('.map-trigger').forEach(trigger => {
      trigger.addEventListener('click', function(e) {
          e.preventDefault();
          const trailPath = this.getAttribute('data-trail-path');
          if (trailPath) openMapModal(trailPath);
      });
  });

</script>

<!-- Integrated Styling Layout -->
<style>
  /* 1. Static Embedded Map Style */
  .hiking-map-container {
    width: 100%;
    height: 300px;
    margin: 20px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    z-index: 10;
    box-sizing: border-box;
  }

  /* 2. Lightbox Pop-up Overlay Style */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    z-index: 9999;
    justify-content: center; align-items: center;
  }
  .modal-content {
    background: #fff; padding: 15px; border-radius: 12px;
    width: 85%; max-width: 800px; height: 75%; max-height: 550px;
    position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  #modal-map-window { width: 100%; height: 100%; border-radius: 6px; border: 1px solid #ddd; }
  .modal-close-btn { position: absolute; top: -40px; right: 0; background: none; border: none; color: white; font-size: 32px; cursor: pointer; }
  .map-trigger {cursor: pointer; text-decoration: none;}
}
</style>
